# i3 config (included by the palette, see ./config), https://i3wm.org/docs/userguide.html
#
# Alt = $mod, Super = $mod2. The shortcuts are listed in cheatsheet.tsv
# ($mod2+slash), keep it in sync when changing them.

set $mod Mod1
set $mod2 Mod4

set $scripts ~/.config/i3/scripts

# #{ key bindings

# drag floating windows with $mod + mouse
floating_modifier $mod

focus_follows_mouse no

bindsym $mod+Return exec kitty

bindsym $mod+Shift+q kill

# focus and move
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym Mod1+Tab focus right

# workspaces of this screen, move the workspace to the next screen
bindsym $mod+n workspace next_on_output
bindsym $mod+m workspace prev_on_output
bindsym $mod+x move workspace to output right

# split and layouts
bindsym $mod+braceright split h
bindsym $mod+braceleft split v
bindsym $mod+f fullscreen
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+b bar mode toggle

# floating, focus between floating and tiled, parent and child containers
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent
bindsym $mod+q focus child

# scratchpad
bindsym $mod+Shift+z move scratchpad
bindsym $mod+z scratchpad show

# i3
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart

# menus
bindsym $mod+d exec --no-startup-id rofi -show drun -theme ~/.config/rofi/launcher.rasi
bindsym $mod2+f exec --no-startup-id $scripts/power_menu.sh
bindsym $mod2+m exec --no-startup-id $scripts/screen_layout_menu.sh
bindsym $mod2+c exec --no-startup-id $scripts/colorscheme_menu.sh
bindsym $mod2+v exec --no-startup-id $scripts/clipboard_menu.sh
bindsym $mod2+slash exec --no-startup-id $scripts/cheatsheet.sh

# screenshot of a region
bindsym Print exec shutter --select

# modes
bindsym $mod+r mode "resize_mode"
bindsym $mod+Shift+g mode "gaps_mode"
bindsym $mod+c mode "mouse_mode"
bindsym $mod+Shift+t mode "throughput_mode"

# F1 does not open the help of the apps
bindsym F1 exec --no-startup-id true

# volume, media and brightness keys (brightness through logind, no root needed)
bindsym XF86AudioMute --release exec --no-startup-id amixer -D pulse sset Master toggle
bindsym XF86AudioLowerVolume --release exec --no-startup-id amixer -D pulse sset Master 5%-
bindsym XF86AudioRaiseVolume --release exec --no-startup-id amixer -D pulse sset Master 5%+
bindsym XF86AudioPlay --release exec --no-startup-id playerctl play-pause
bindsym XF86AudioPause --release exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext --release exec --no-startup-id playerctl next
bindsym XF86AudioPrev --release exec --no-startup-id playerctl previous
bindsym XF86MonBrightnessDown exec --no-startup-id $scripts/brightness.sh -
bindsym XF86MonBrightnessUp exec --no-startup-id $scripts/brightness.sh +

# #}

# #{ workspaces

set $workspace1 "1: "
set $workspace2 "2: "
set $workspace3 "3: "
set $workspace4 "4: "
set $workspace5 "5"
set $workspace6 "6"
set $workspace7 "7"
set $workspace8 "8"
set $workspace9 "9"
set $workspace10 "10"

bindsym $mod+1 workspace $workspace1
bindsym $mod+2 workspace $workspace2
bindsym $mod+3 workspace $workspace3
bindsym $mod+4 workspace $workspace4
bindsym $mod+5 workspace $workspace5
bindsym $mod+6 workspace $workspace6
bindsym $mod+7 workspace $workspace7
bindsym $mod+8 workspace $workspace8
bindsym $mod+9 workspace $workspace9
bindsym $mod+0 workspace $workspace10

bindsym $mod+Shift+1 move container to workspace $workspace1
bindsym $mod+Shift+2 move container to workspace $workspace2
bindsym $mod+Shift+3 move container to workspace $workspace3
bindsym $mod+Shift+4 move container to workspace $workspace4
bindsym $mod+Shift+5 move container to workspace $workspace5
bindsym $mod+Shift+6 move container to workspace $workspace6
bindsym $mod+Shift+7 move container to workspace $workspace7
bindsym $mod+Shift+8 move container to workspace $workspace8
bindsym $mod+Shift+9 move container to workspace $workspace9
bindsym $mod+Shift+0 move container to workspace $workspace10

# #}

# #{ appearance

font pango:Terminus 11

for_window [class="^.*"] border pixel $border_width
hide_edge_borders both

client.focused          $active_border        $active_background    $active_text_color    $split_indicator
client.unfocused        $inactive_background  $inactive_background  $inactive_text_color  $split_indicator
client.focused_inactive $active_background    $inactive_background  $inactive_text_color  $split_indicator
client.urgent           $inactive_background  $inactive_background  $inactive_text_color  $split_indicator

smart_gaps on
gaps inner 12
gaps outer 0

bar {
  status_command i3blocks -c ~/.config/i3blocks/config

  # no '-t': with a 32-bit (transparent) bar, the tray icons' transparent pixels
  # show the wallpaper through, i.e., dark squares around the tray icons
  i3bar_command i3bar

  font pango: Terminus, FontAwesome 11
  tray_output primary
  position top

  colors {
    statusline $bar_text
    background $bar_bg
    separator  $inactive_text_color

    #                  border          background      text
    focused_workspace  $focused_ws_bg  $focused_ws_bg  $active_text_color
    active_workspace   $bar_bg         $bar_bg         $active_text_color
    inactive_workspace $bar_bg         $bar_bg         $active_text_color
    binding_mode       $bar_bg         $bar_bg         $active_text_color
    urgent_workspace   $bar_bg         $bar_bg         $urgent
  }
}

# #}

# #{ autostart

exec_always --no-startup-id feh --bg-fill ~/Pictures/wallpaper/wallpaper.webp

# key repeat: delay 350 ms, 55 per second
exec_always --no-startup-id xset r rate 350 55

# compositor (transparency of the rofi menus)
exec --no-startup-id compton -f -D 3 --backend glx --paint-on-overlay --vsync opengl-swc

# tap to click on the touchpad
exec --no-startup-id $scripts/touchpad_tapping.sh

# tray applets (nm-applet, blueman) with icons matching the palette, restarted
# when they crash on an i3bar restart or when the palette changes
exec_always --no-startup-id $scripts/ensure_tray_apps.sh

# clipboard history server, used by $mod2+v
exec --no-startup-id copyq --start-server

# #}

# #{ window rules (find the class and title with xprop)

for_window [class="^Thunar$"] floating disable
for_window [class="^Tk$"] floating enable
for_window [class="^Octave-gui$"] floating enable
for_window [class="^Google-chrome$"] floating disable
for_window [title="^Figure"] floating disable
for_window [title="Microsoft Teams Notification" class="(?i)^microsoft teams - preview$"] floating enable
for_window [class="matplotlib"] floating enable
for_window [title="pdfpc"] border none floating disable
for_window [title="pythonplot"] floating disable

# #}

# #{ modes

# resize, symmetrically with hjkl and the arrows, one side with Shift (grow) and $mod+Shift (shrink)
mode "resize_mode" {
  bindsym h resize shrink left 1 px or 1 ppt, resize shrink right 1 px or 1 ppt
  bindsym j resize shrink down 1 px or 1 ppt, resize shrink up 1 px or 1 ppt
  bindsym k resize grow up 1 px or 1 ppt, resize grow down 1 px or 1 ppt
  bindsym l resize grow right 1 px or 1 ppt, resize grow left 1 px or 1 ppt

  bindsym Shift+h resize grow left 1 px or 1 ppt
  bindsym Shift+j resize grow down 1 px or 1 ppt
  bindsym Shift+k resize grow up 1 px or 1 ppt
  bindsym Shift+l resize grow right 1 px or 1 ppt
  bindsym $mod+Shift+h resize shrink left 1 px or 1 ppt
  bindsym $mod+Shift+j resize shrink down 1 px or 1 ppt
  bindsym $mod+Shift+k resize shrink up 1 px or 1 ppt
  bindsym $mod+Shift+l resize shrink right 1 px or 1 ppt

  bindsym Left resize shrink left 10 px or 10 ppt, resize shrink right 10 px or 10 ppt
  bindsym Down resize shrink down 10 px or 10 ppt, resize shrink up 10 px or 10 ppt
  bindsym Up resize grow up 10 px or 10 ppt, resize grow down 10 px or 10 ppt
  bindsym Right resize grow right 10 px or 10 ppt, resize grow left 10 px or 10 ppt

  bindsym Return mode "default"
  bindsym Escape mode "default"
}

# gaps of the current workspace: +/- inner, Shift +/- outer, 0 resets
mode "gaps_mode" {
  bindsym plus gaps inner current plus 4
  bindsym minus gaps inner current minus 4
  bindsym Shift+plus gaps outer current plus 4
  bindsym Shift+minus gaps outer current minus 4
  bindsym 0 gaps inner current set 12; gaps outer current set 0

  bindsym Return mode "default"
  bindsym Escape mode "default"
}

# mouse with the keyboard: hjkl move (Shift faster), f/u click, d/i right click,
# r holds the button (longpress_mode), b moves the pointer to the focused window
mode "mouse_mode" {
  bindsym h exec --no-startup-id xdotool mousemove_relative --sync -- -10 0
  bindsym j exec --no-startup-id xdotool mousemove_relative --sync -- 0 10
  bindsym k exec --no-startup-id xdotool mousemove_relative --sync -- 0 -10
  bindsym l exec --no-startup-id xdotool mousemove_relative --sync -- 10 0

  bindsym Shift+h exec --no-startup-id xdotool mousemove_relative --sync -- -25 0
  bindsym Shift+j exec --no-startup-id xdotool mousemove_relative --sync -- 0 25
  bindsym Shift+k exec --no-startup-id xdotool mousemove_relative --sync -- 0 -25
  bindsym Shift+l exec --no-startup-id xdotool mousemove_relative --sync -- 25 0

  bindsym $mod+h focus left
  bindsym $mod+j focus down
  bindsym $mod+k focus up
  bindsym $mod+l focus right
  bindsym $mod+n workspace next_on_output
  bindsym $mod+m workspace prev_on_output

  bindsym f exec --no-startup-id xdotool click 1
  bindsym d exec --no-startup-id xdotool click 3
  bindsym u exec --no-startup-id xdotool click 1
  bindsym i exec --no-startup-id xdotool click 3

  bindsym r exec --no-startup-id xdotool mousedown 1; mode "longpress_mode"
  bindsym b exec --no-startup-id $scripts/banish_mouse.sh
  bindsym Escape mode "default"
}

# the mouse button is held down (drag), r releases it
mode "longpress_mode" {
  bindsym h exec --no-startup-id xdotool mousemove_relative --sync -- -10 0
  bindsym j exec --no-startup-id xdotool mousemove_relative --sync -- 0 10
  bindsym k exec --no-startup-id xdotool mousemove_relative --sync -- 0 -10
  bindsym l exec --no-startup-id xdotool mousemove_relative --sync -- 10 0

  bindsym r exec --no-startup-id xdotool mouseup 1; mode "mouse_mode"
  bindsym Escape exec --no-startup-id xdotool mouseup 1; mode "default"
}

# pass-through: i3 ignores the keys (VMs, remote desktop), $mod+Shift+t leaves
mode "throughput_mode" {
  bindsym $mod+Shift+t mode "default"
}

# #}
