# kitty config, tmux does the tabs and splits, so kitty only draws the terminal

# colors of the active palette ($mod2+c switches it, kitty reloads on SIGUSR1)
include ~/.config/ubuntu-setup/palette/kitty.conf

font_family Inconsolata
font_size 14

# no "are you sure" when closing a window (tmux is always running in it)
confirm_os_window_close 0

# #{ keys

# no kitty shortcuts, they would hide keys from tmux (e.g. Ctrl+Shift+arrows)
clear_all_shortcuts yes

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+minus change_font_size all -1.0
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all 0

# Ctrl+9 / Ctrl+0 as the codes tmux knows (the splits in ~/.tmux.conf)
map ctrl+9 send_text all \x1b[27;5;57~
map ctrl+0 send_text all \x1b[27;5;48~

# #}
