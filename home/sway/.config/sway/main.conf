# sway config (included by ./config after the palette), man 5 sway
#
# Alt = $mod, Super = $mod2. The shortcuts are listed in cheatsheet.tsv
# ($mod2+slash), keep it in sync when changing them.

set $mod Mod1
set $mod2 Mod4

set $scripts ~/.config/sway/scripts

# Ubuntu's snippets, e.g. exporting WAYLAND_DISPLAY to systemd and D-Bus so that
# the portals (screen sharing, file pickers) and the tray applets find sway
include /etc/sway/config.d/*

# #{ key bindings

# drag floating windows with $mod + mouse (right button resizes)
floating_modifier $mod normal

focus_follows_mouse no

bindsym $mod+Return exec kitty

bindsym $mod+Shift+q kill

# focus and move
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym Mod1+Tab focus right

# workspaces of this screen, move the workspace to the next screen
bindsym $mod+n workspace next_on_output
bindsym $mod+m workspace prev_on_output
bindsym $mod+x move workspace to output right

# split and layouts
bindsym $mod+braceright split h
bindsym $mod+braceleft split v
bindsym $mod+f fullscreen
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+b bar mode toggle

# floating, focus between floating and tiled, parent and child containers
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent
bindsym $mod+q focus child

# scratchpad
bindsym $mod+Shift+z move scratchpad
bindsym $mod+z scratchpad show

# sway (no restart needed: the bar and the workspaces follow the screens by themselves)
bindsym $mod+Shift+c reload

# menus
bindsym $mod+d exec rofi -show drun -theme ~/.config/rofi/launcher.rasi
bindsym $mod2+f exec $scripts/power_menu.sh
bindsym $mod2+m exec $scripts/screen_layout_menu.sh
bindsym $mod2+c exec $scripts/colorscheme_menu.sh
bindsym $mod2+v exec $scripts/clipboard_menu.sh
bindsym $mod2+n exec ~/.local/bin/netscan rofi
bindsym $mod2+slash exec $scripts/cheatsheet.sh

# screenshot of a region, opened in swappy (draw, save, copy)
bindsym Print exec grim -g "$(slurp)" - | swappy -f -

# modes
bindsym $mod+r mode "resize_mode"
bindsym $mod+Shift+g mode "gaps_mode"
bindsym $mod+c mode "mouse_mode"
bindsym $mod+Shift+t mode "throughput_mode"

# F1 does not open the help of the apps
bindsym F1 exec true

# volume (PipeWire, capped at 100 %), media and brightness keys (brightness
# through logind, no root needed), they also work on the lock screen
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86MonBrightnessDown exec $scripts/brightness.sh -
bindsym --locked XF86MonBrightnessUp exec $scripts/brightness.sh +

# #}

# #{ workspaces

set $workspace1 "1: "
set $workspace2 "2: "
set $workspace3 "3: "
set $workspace4 "4: "
set $workspace5 "5"
set $workspace6 "6"
set $workspace7 "7"
set $workspace8 "8"
set $workspace9 "9"
set $workspace10 "10"

# bound to the keys of the number row (codes 10 to 19), not to the digits: on a layout
# where the digits need Shift (French), $mod+1 would be $mod+Shift+& and the window could
# not be moved. A workspace is created by going to it, and removed when left empty.
bindcode $mod+10 workspace $workspace1
bindcode $mod+11 workspace $workspace2
bindcode $mod+12 workspace $workspace3
bindcode $mod+13 workspace $workspace4
bindcode $mod+14 workspace $workspace5
bindcode $mod+15 workspace $workspace6
bindcode $mod+16 workspace $workspace7
bindcode $mod+17 workspace $workspace8
bindcode $mod+18 workspace $workspace9
bindcode $mod+19 workspace $workspace10

bindcode $mod+Shift+10 move container to workspace $workspace1
bindcode $mod+Shift+11 move container to workspace $workspace2
bindcode $mod+Shift+12 move container to workspace $workspace3
bindcode $mod+Shift+13 move container to workspace $workspace4
bindcode $mod+Shift+14 move container to workspace $workspace5
bindcode $mod+Shift+15 move container to workspace $workspace6
bindcode $mod+Shift+16 move container to workspace $workspace7
bindcode $mod+Shift+17 move container to workspace $workspace8
bindcode $mod+Shift+18 move container to workspace $workspace9
bindcode $mod+Shift+19 move container to workspace $workspace10

# #}

# #{ appearance

font pango:Terminus 11

default_border pixel $border_width
default_floating_border pixel $border_width
hide_edge_borders both

client.focused          $active_border        $active_background    $active_text_color    $split_indicator
client.unfocused        $inactive_background  $inactive_background  $inactive_text_color  $split_indicator
client.focused_inactive $active_background    $inactive_background  $inactive_text_color  $split_indicator
client.urgent           $inactive_background  $inactive_background  $inactive_text_color  $split_indicator

smart_gaps on
gaps inner 12
gaps outer 0

bar {
  status_command i3blocks -c ~/.config/i3blocks/config

  font pango: Terminus, FontAwesome 11
  position top

  # tray on every screen, icons from the palette's theme (light icons on the dark bar)
  icon_theme $tray_icon_theme

  colors {
    statusline $bar_text
    background $bar_bg
    separator  $inactive_text_color

    #                  border          background      text
    focused_workspace  $focused_ws_bg  $focused_ws_bg  $active_text_color
    active_workspace   $bar_bg         $bar_bg         $active_text_color
    inactive_workspace $bar_bg         $bar_bg         $active_text_color
    binding_mode       $bar_bg         $bar_bg         $active_text_color
    urgent_workspace   $bar_bg         $bar_bg         $urgent
  }
}

# #}

# #{ input

# key repeat: delay 350 ms, 55 per second. The layouts and the switch key come
# from /etc/default/keyboard (sway ignores it), see scripts/keyboard_layout.sh
input type:keyboard {
  repeat_delay 350
  repeat_rate 55
}
exec_always $scripts/keyboard_layout.sh

# tap to click, two fingers right click, three middle click, clicking anywhere on the pad
input type:touchpad {
  tap enabled
  tap_button_map lrm
  click_method clickfinger
}

# #}

# #{ autostart

# wallpaper, a plain color when the picture is missing (.webp needs webp-pixbuf-loader)
output * bg $background_color solid_color
exec_always test -f ~/Pictures/wallpaper/wallpaper.webp && swaymsg 'output * bg ~/Pictures/wallpaper/wallpaper.webp fill'

# lock the screen before every suspend (power menu, lid, systemctl suspend)
exec swayidle -w before-sleep 'swaylock -f -c 0B1220'

# tray applets, swaybar only shows StatusNotifierItem icons (hence --indicator)
exec nm-applet --indicator
exec blueman-applet

# clipboard history, used by $mod2+v
exec wl-paste --watch cliphist store

# #}

# #{ window rules (find the app_id, or the class of X11 apps, with: swaymsg -t get_tree)

# native Wayland windows have an app_id, X11 ones (through Xwayland) a class
for_window [app_id="^thunar$"] floating disable
for_window [class="^Thunar$"] floating disable
for_window [class="^Tk$"] floating enable
for_window [app_id="^org.octave.Octave$"] floating enable
for_window [class="^Octave-gui$"] floating enable
for_window [app_id="^google-chrome$"] floating disable
for_window [class="^Google-chrome$"] floating disable
for_window [title="^Figure"] floating disable
for_window [app_id="matplotlib"] floating enable
for_window [class="matplotlib"] floating enable
for_window [title="pdfpc"] border none, floating disable
for_window [title="pythonplot"] floating disable

# #}

# #{ modes

# resize, symmetrically with hjkl and the arrows, one side with Shift (grow) and $mod+Shift (shrink)
mode "resize_mode" {
  bindsym h resize shrink left 1 px or 1 ppt, resize shrink right 1 px or 1 ppt
  bindsym j resize shrink down 1 px or 1 ppt, resize shrink up 1 px or 1 ppt
  bindsym k resize grow up 1 px or 1 ppt, resize grow down 1 px or 1 ppt
  bindsym l resize grow right 1 px or 1 ppt, resize grow left 1 px or 1 ppt

  bindsym Shift+h resize grow left 1 px or 1 ppt
  bindsym Shift+j resize grow down 1 px or 1 ppt
  bindsym Shift+k resize grow up 1 px or 1 ppt
  bindsym Shift+l resize grow right 1 px or 1 ppt
  bindsym $mod+Shift+h resize shrink left 1 px or 1 ppt
  bindsym $mod+Shift+j resize shrink down 1 px or 1 ppt
  bindsym $mod+Shift+k resize shrink up 1 px or 1 ppt
  bindsym $mod+Shift+l resize shrink right 1 px or 1 ppt

  bindsym Left resize shrink left 10 px or 10 ppt, resize shrink right 10 px or 10 ppt
  bindsym Down resize shrink down 10 px or 10 ppt, resize shrink up 10 px or 10 ppt
  bindsym Up resize grow up 10 px or 10 ppt, resize grow down 10 px or 10 ppt
  bindsym Right resize grow right 10 px or 10 ppt, resize grow left 10 px or 10 ppt

  bindsym Return mode "default"
  bindsym Escape mode "default"
}

# gaps of the current workspace: +/- inner, Shift +/- outer, 0 resets
mode "gaps_mode" {
  bindsym plus gaps inner current plus 4
  bindsym minus gaps inner current minus 4
  bindsym Shift+plus gaps outer current plus 4
  bindsym Shift+minus gaps outer current minus 4
  bindsym 0 gaps inner current set 12; gaps outer current set 0

  bindsym Return mode "default"
  bindsym Escape mode "default"
}

# mouse with the keyboard: hjkl move (Shift faster), f/u click, d/i right click,
# r holds the button (longpress_mode), b moves the pointer to the focused window
set $cursor seat seat0 cursor
mode "mouse_mode" {
  bindsym h $cursor move -10 0
  bindsym j $cursor move 0 10
  bindsym k $cursor move 0 -10
  bindsym l $cursor move 10 0

  bindsym Shift+h $cursor move -25 0
  bindsym Shift+j $cursor move 0 25
  bindsym Shift+k $cursor move 0 -25
  bindsym Shift+l $cursor move 25 0

  bindsym $mod+h focus left
  bindsym $mod+j focus down
  bindsym $mod+k focus up
  bindsym $mod+l focus right
  bindsym $mod+n workspace next_on_output
  bindsym $mod+m workspace prev_on_output

  bindsym f $cursor press button1; $cursor release button1
  bindsym d $cursor press button3; $cursor release button3
  bindsym u $cursor press button1; $cursor release button1
  bindsym i $cursor press button3; $cursor release button3

  bindsym r $cursor press button1; mode "longpress_mode"
  bindsym b exec $scripts/banish_mouse.sh
  bindsym Escape mode "default"
}

# the mouse button is held down (drag), r releases it
mode "longpress_mode" {
  bindsym h $cursor move -10 0
  bindsym j $cursor move 0 10
  bindsym k $cursor move 0 -10
  bindsym l $cursor move 10 0

  bindsym r $cursor release button1; mode "mouse_mode"
  bindsym Escape $cursor release button1; mode "default"
}

# pass-through: sway ignores the keys (VMs, remote desktop), $mod+Shift+t leaves
mode "throughput_mode" {
  bindsym $mod+Shift+t mode "default"
}

# #}
