# tmux config, started in every kitty terminal by ~/.config/bash/bashrc (prefix Ctrl+A)

# #{ options

set -g prefix C-a
set -g default-shell /bin/bash
set -g default-terminal "screen-256color"
set -sg escape-time 0
set -g history-limit 5000
set -g renumber-windows on
set -g aggressive-resize on
setw -g allow-rename off
setw -g automatic-rename off
set -g status-keys vi
setw -g mode-keys vi
set -g word-separators " -_@"
set -g bell-action none
setw -g clock-mode-colour colour135

# #}

# #{ status bar, colors from the active palette ($mod2+c switches it)

source-file ~/.config/ubuntu-setup/palette/tmux.conf

set -g status-interval 2
set -g status-left ''
set -g status-left-length 20
set -g status-right '#[fg=#{@pal-clock-fg},bg=#{@pal-clock-bg},bold] %d/%m #[bg=#{@pal-clock-alt-bg}] %H:%M:%S #[bg=#{@pal-clock-bg}] #H '
set -g status-right-length 50
setw -g window-status-current-format '#I#[fg=#{@pal-current-fg},bg=#{@pal-current-bg}]:#W#[fg=#{@pal-current-flag-fg}]#F '
setw -g window-status-format ' #I#[fg=#{@pal-window-sep-fg}]:#[fg=#{@pal-window-fg}]#W#[fg=#{@pal-window-flag-fg}]#F '

# #}

# #{ windows and splits

# Ctrl+T new window, Alt+U/I and Shift+arrows next/previous, Ctrl+Shift+arrows move
bind -n C-t new-window -a -c "#{pane_current_path}"
bind -n M-u next
bind -n M-i prev
bind -n S-Right next
bind -n S-Left prev
bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# Ctrl+9 (like Ctrl+( ) vertical, Ctrl+0 (like Ctrl+) ) horizontal split, in the current folder
# (kitty sends them as CSI 27;5;57~ and CSI 27;5;48~, see kitty.conf)
bind -n C-9 split-window -v -c "#{pane_current_path}"
bind -n C-0 split-window -h -c "#{pane_current_path}"

# #}

# #{ panes

# Ctrl+H/J/K/L move between panes and vim splits (like vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Alt+arrows and Alt+Y/O left/right as well (Alt+U/I switch windows)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-y select-pane -L
bind -n M-o select-pane -R

# prefix + Ctrl+H/J/K/L resize
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# #}

# #{ copy and paste

# F2 copy mode, v selects, Ctrl+V rectangle, y copies to the clipboard, prefix + p pastes it
bind -n F2 copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
unbind p
bind p run-shell "tmux set-buffer \"$(xclip -o)\"; tmux paste-buffer"

# #}

# #{ vim

# Ctrl+P: file search in vim (:find), typed on the prompt when not in vim
bind -n C-p if-shell "$is_vim" { send-keys C-p } { send-keys "vim -c 'call feedkeys(\"\\<C-p>\")'" }

# #}

# #{ session and scripts

# prefix + k kills the session with everything running in it (killp from the bashrc),
# the terminal then goes back to the session's folder
bind k menu -x R -t 0 -T "Kill the session?" "Select this menu item and hit enter!" 9 'split-window; send-keys "sleep 1; pwd >> /tmp/tmux_restore_path.txt; tmux list-panes -s -F \"#\{pane_pid\} #\{pane_current_command\}\" | grep -v tmux | cut -d\" \" -f1 | while read in; do killp \$in; done" C-m exit C-m'

bind r source-file ~/.tmux.conf

# prefix + m / u mount / unmount a drive, prefix + e ends an experiment (rosbag)
bind m run-shell "~/.config/tmux/scripts/tmux_mount.sh"
bind u run-shell "~/.config/tmux/scripts/tmux_unmount.sh"
bind e run-shell "~/.config/tmux/scripts/tmux_end_experiment.sh"

# cmdvault: prefix + ? searches the command vault in a popup (~/git/cmdvault)
source-file -q ~/git/cmdvault/tmux/cmdvault.tmux

# #}
