# dark palette of tmux, sourced by the tmux config (the status formats use the @pal-* options)

set -g status-style "bg=colour233,fg=colour15"
set -g @pal-accent-bg "colour26"
set -g @pal-accent-fg "colour15"
set -g @pal-bar-bg "colour236"
set -g @pal-item-bg "colour239"
set -g @pal-item-fg "colour253"
set -g @pal-muted-fg "colour244"
