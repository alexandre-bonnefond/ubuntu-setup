# dark palette of tmux, sourced by ~/.tmux.conf (the status formats use the @pal-* options)

set -g status-style "bg=colour233,fg=colour15"
set -g @pal-clock-fg "colour15"
set -g @pal-clock-bg "colour26"
set -g @pal-clock-alt-bg "colour239"
set -g @pal-current-fg "colour253"
set -g @pal-current-bg "colour239"
set -g @pal-current-flag-fg "colour50"
set -g @pal-window-fg "colour244"
set -g @pal-window-sep-fg "colour240"
set -g @pal-window-flag-fg "colour240"
