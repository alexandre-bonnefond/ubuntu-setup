# light palette of tmux, sourced by the tmux config (the status formats use the @pal-* options)

set -g status-style "bg=white,fg=black"
set -g @pal-accent-bg "colour241"
set -g @pal-accent-fg "colour15"
set -g @pal-bar-bg "colour252"
set -g @pal-item-bg "colour245"
set -g @pal-item-fg "colour15"
set -g @pal-muted-fg "colour241"
