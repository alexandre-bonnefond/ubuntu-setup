# light palette of tmux, sourced by ~/.tmux.conf (the status formats use the @pal-* options)

set -g status-style "bg=default,fg=black"
set -g @pal-clock-fg "colour15"
set -g @pal-clock-bg "colour241"
set -g @pal-clock-alt-bg "colour245"
set -g @pal-current-fg "black"
set -g @pal-current-bg "colour244"
set -g @pal-current-flag-fg "colour50"
set -g @pal-window-fg "colour240"
set -g @pal-window-sep-fg "colour237"
set -g @pal-window-flag-fg "colour244"
