# light palette of sway and swaybar, included by ~/.config/sway/config

set $focused_ws_bg        #aaaaaa
set $active_text_color    #1d2021
set $inactive_text_color  #1d2021
set $inactive_background  #dddddd
set $active_background    #888888
set $active_border        #aaaaaa
set $background_color     #ffffff
set $split_indicator      #aaaaaa
set $urgent               #ff0000
set $bar_bg               #FFFFFFFF
set $bar_text             #000000
set $border_width         2

# dark tray icons on the light bar
set $tray_icon_theme      ubuntu-mono-light
